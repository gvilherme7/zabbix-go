version: '3.5'
services:
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-6.0-latest
    ports:
      - "10051:10051"
    environment:
      - DB_SERVER_HOST=postgres-server
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix
      - ZBX_CACHESIZE=256M
    depends_on:
      - postgres-server
    networks:
      zbx_net:
        aliases:
          - zabbix-server
          
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-6.0-latest
    ports:
      - "8080:8080"
    environment:
      - DB_SERVER_HOST=postgres-server
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=America/Sao_Paulo
    depends_on:
      - postgres-server
      - zabbix-server
    networks:
      - zbx_net

  zabbix-proxy:
    image: zabbix/zabbix-proxy-sqlite3:ubuntu-6.0-latest
    ports:
      - "10052:10051"
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_PROXYMODE=0
      - ZBX_HOSTNAME=ZabbixProxyLocal
      - ZBX_CACHESIZE=128M
    depends_on:
      - zabbix-server
    networks:
      - zbx_net

  postgres-server:
    image: postgres:14-alpine
    environment:
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix
    networks:
      zbx_net:
        aliases:
          - postgres-server

networks:
  zbx_net:
    driver: bridge
